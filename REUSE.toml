# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3).
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Copies of the artwork from kernoid/brand – kept as they are, under its licence.
[[annotations]]
path = ["favicon.*", "apple-touch-icon.png", "icon-*.png", "site.webmanifest", "social.png", "assets/**"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

# The fonts, self-hosted: IBM Plex under the SIL Open Font License.
[[annotations]]
path = "assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright © 2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"
